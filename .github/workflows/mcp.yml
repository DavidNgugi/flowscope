name: MCP server CI

# Continuous verification. Publishing lives in release.yml, so a merge can
# never publish by accident.
on:
  push:
    branches: [main]
    paths: &paths
      - "mcp/**"
      - ".claude-plugin/**"
      - ".github/actions/verify-mcp/**"
      - ".github/workflows/mcp.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths: *paths

defaults:
  run:
    working-directory: mcp

jobs:
  # The version check is separate and unconditional: a drift here is what makes
  # a release fail halfway through publishing, so it should be obvious on its own
  # rather than buried in a longer job's output.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/version.py show
      - run: python scripts/version.py check

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify-mcp

  # The declared floor is a promise; prove it is not a lie.
  oldest-python:
    name: Test on the declared minimum (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
